name: Release on Version Change

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'

      - name: Find .csproj file
        id: find_csproj
        run: |
          file=$(find . -name "*.csproj" | head -n 1)
          echo "file=$file" >> $GITHUB_OUTPUT

      - name: Get current version
        id: curr_version
        run: |
          version=$(grep -oP '<Version>\K[^<]+' "${{ steps.find_csproj.outputs.file }}" || echo "0.0.0")
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get previous version
        id: prev_version
        run: |
          git checkout HEAD^ || exit 0
          version=$(grep -oP '<Version>\K[^<]+' "${{ steps.find_csproj.outputs.file }}" || echo "0.0.0")
          echo "prev_version=$version" >> $GITHUB_OUTPUT
          git checkout -

      - name: Check if version changed
        id: check_version
        run: |
          if [ "${{ steps.curr_version.outputs.version }}" != "${{ steps.prev_version.outputs.prev_version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build the project
        if: steps.check_version.outputs.changed == 'true'
        run: |
          dotnet build "${{ steps.find_csproj.outputs.file }}" -c Release

      - name: Find built DLL
        id: find_dll
        if: steps.check_version.outputs.changed == 'true'
        run: |
          dll=$(find . -type f -name "*.dll" -path "*bin/Release/*" | grep -v "ref/" | head -n 1)
          echo "dll=$dll" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.check_version.outputs.changed == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.curr_version.outputs.version }}
          name: Release v${{ steps.curr_version.outputs.version }}
          generateReleaseNotes: true
          artifacts: ${{ steps.find_dll.outputs.dll }}
